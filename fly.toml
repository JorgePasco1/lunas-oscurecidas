# fly.io config for the Lunas Oscurecidas watcher.
# This is a background worker (no inbound HTTP), so it must stay running 24/7.
#
# One-time setup before `fly deploy`:
#   fly launch --no-deploy          # or `fly apps create lunas-oscurecidas-watcher`
#   fly volumes create data --size 1 --region scl
#   fly secrets set PNP_DNI=... PNP_CLAVE=... TELEGRAM_BOT_TOKEN=... TELEGRAM_CHAT_ID=...
#   fly deploy

app = "lunas-oscurecidas-watcher"
primary_region = "gru"   # São Paulo — closest fly region to Peru

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  TARGET_SEDE = "LIMA-LA VICTORIA"
  CHECK_CRON = "*/5 * * * *"
  HEARTBEAT_HOURS = "6"
  FAILURE_ALERT_THRESHOLD = "3"
  HEADLESS = "true"

# Persist state.json + failure screenshots across restarts.
[mounts]
  source = "data"
  destination = "/data"

# Single always-on machine. No [http_service], so the worker never auto-stops.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"   # Chromium needs headroom; 512mb is tight.
